name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deny by default; every job below declares the scopes it actually needs.
permissions: {}

# A newer push cancels a pull request's run, but every main run finishes:
# a release requires a complete CI run for its exact commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  # Audits the workflows themselves: template injection, over-broad
  # permissions, unpinned actions, persisted credentials, cache poisoning.
  zizmor:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          online-audits: false

  # Commit subjects are the release notes (cliff.toml), so they are checked
  # like code; see the Changelog section of AGENTS.md.
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range being checked is history the default shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit subject the changelog will publish
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A first push or a rewritten branch has no usable base; check the
          # tip alone rather than every commit that ever reached the repository.
          if [[ ! $BASE =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$HEAD_SHA~1"
          fi
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 scripts/release/check-commit-messages.py range "$BASE..$HEAD_SHA"
          else
            # The very first commit has no parent: check it alone.
            git log -1 --format=%B "$HEAD_SHA" > "$RUNNER_TEMP/message"
            python3 scripts/release/check-commit-messages.py message "$RUNNER_TEMP/message"
          fi

  sources:
    name: Format and source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: taplo
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check TOML formatting
        run: taplo fmt --check
      - name: Check source file sizes
        run: bash scripts/check-file-size.sh
      - name: Check keep-sorted regions
        run: |
          python3 scripts/test_check_sorted.py
          python3 scripts/check-sorted.py
      - name: Type-check the Luau
        run: |
          lsp=$(scripts/setup-luau-lsp.sh)
          files=$(find app -name '*.luau' -not -name '*.d.luau' | sort)
          # shellcheck disable=SC2086 # one argument per file
          output=$("$lsp" analyze --platform=standard --definitions=@moonframe=types/moonframe.d.luau $files 2>&1 | grep -v '^\[INFO\]' || true)
          if [[ -n $output ]]; then
            echo "$output"
            exit 1
          fi

  build:
    name: Build, lint and test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # The window is tried headlessly on each; package.yml builds the
        # Linux, Windows and macOS packages.
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - name: Install tmux, so the test against a real tmux runs
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            sudo apt-get install -y --no-install-recommends tmux
          else
            brew install tmux
          fi
          tmux -V
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the lockfile is current
        run: cargo fetch --locked
      - name: Clippy (all targets)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      # Each terminal backend is a cargo feature; the app builds with
      # either alone as well as with both (the default, above).
      - name: Clippy and test with herdr-core alone
        run: |
          cargo clippy --locked --all-targets --no-default-features --features herdr-core -- -D warnings
          cargo test --locked --no-default-features --features herdr-core
      - name: Clippy and test with tmux alone
        run: |
          cargo clippy --locked --all-targets --no-default-features --features tmux -- -D warnings
          cargo test --locked --no-default-features --features tmux
      - name: Load the app headlessly
        run: cargo run --locked -- --check --no-user
