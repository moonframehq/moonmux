# herdr-core, shared as `app.core`: the native provider in src/core.rs. It
# lists what herdr-core runs (`hc ls`) each second, says which terminals
# are this app's panes and which agents need you, and sends text and keys
# to a terminal when a mod asks.
interval = 1.0
kind     = "native"
# The sidebar and status bar read it from the first frame.
start = "always"

[settings]
# The mods that may act on terminals: type into one, press its keys,
# interrupt it, read its screen (a peek), or end a closed pane's shell. These
# reach any terminal in herdr-core, so a mod from a package the user
# installed is refused unless its name is added here.
writers = ["peek", "workspace"]
