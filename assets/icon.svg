<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
<title id="title">Moonmux</title>
<!-- A terminal prompt on Moonframe's teal badge: a cream chevron, and a
     cursor striped like Moonframe's retro sunset moon. Render with
     `just icon`. -->
<defs>
  <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  <clipPath id="cursor"><rect x="560" y="560" width="170" height="96" rx="21"/></clipPath>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
  </filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="#3b2417" filter="url(#shadow)"/>
<g clip-path="url(#tile)">
  <circle cx="512" cy="512" r="304" fill="#2e6462"/>
  <path d="M355 390 L515 510 L355 630" fill="none" stroke="#f6e7c8" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <g clip-path="url(#cursor)">
    <rect x="560" y="560" width="170" height="38.4" fill="#f2b33d"/>
    <rect x="560" y="598.4" width="170" height="28.8" fill="#e8642c"/>
    <rect x="560" y="627.2" width="170" height="28.8" fill="#c63d26"/>
  </g>
</g>
</svg>
