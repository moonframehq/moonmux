[package]
description  = "Herdr on Moonframe: spaces, tabs and panes of terminals kept by herdr-core, and the agents in them"
edition      = "2024"
license      = "MIT"
name         = "herdr-moonframe"
publish      = false
repository   = "https://github.com/penso/herdr-moonframe"
rust-version = "1.99"
version      = "0.1.0"

[lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[dependencies]
# The window, laid out by app/ in Luau, with its terminals kept by
# herdr-core (`herdr-core`). Pinned to one commit of the public repository;
# to work on both, patch it to a checkout:
#   [patch."https://github.com/penso/moonframe"]
#   moonframe = { path = "../moonframe/crates/moonframe" }
moonframe  = { default-features = false, features = ["acp", "alacritty", "herdr-core", "tokio"], git = "https://github.com/penso/moonframe", rev = "4b2ee50e0f8fed91546001bfbd1ef368c394de5d" }
serde_json = "1"
tracing    = "0.1"

[profile.dev.package."*"]
# GPUI and Luau are unusably slow unoptimised; keep our own crate
# debuggable.
opt-level = 2

[profile.release]
codegen-units = 16
lto           = "thin"

# A crate of its own, even inside another's folder.
[workspace]
