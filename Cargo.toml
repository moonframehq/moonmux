[package]
description  = "Moonmux: spaces, tabs and panes of terminals kept by herdr-core or tmux, and the agents in them"
edition      = "2024"
license      = "MIT"
name         = "moonmux"
publish      = false
repository   = "https://github.com/moonframehq/moonmux"
rust-version = "1.99"
version      = "0.1.0"

[lints.rust]
unsafe_code           = "deny"
unused_qualifications = "deny"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[dependencies]
# The window, laid out by app/ in Luau, with its terminals kept by
# herdr-core or tmux (see [features]). Follows the public repository's
# `main`; Cargo.lock holds the commit built, which `just moonframe` moves to
# main's latest (Dependabot too). To work on both, patch it to a checkout:
#   [patch."https://github.com/moonframehq/moonframe"]
#   moonframe = { path = "../moonframe/crates/moonframe" }
#   moonframe-rune = { path = "../moonframe/crates/moonframe-rune" }
# Every Moonframe default but `herdr-core`, which is our own feature below:
# Developer Mode (`studio`), Make it yours (`acp`), and Wasm providers
# (`wasm`: the toolbox's `system`, behind `app.system`, and those users
# add). Leaving a default out takes it from every user of the build, so
# list each one when Moonframe adds another.
moonframe-gpui = { branch = "main", default-features = false, features = ["acp", "alacritty", "browser", "chat", "docs", "forge", "git", "markdown", "prose", "shell", "studio", "syntax", "tokio", "updates", "usage", "wasm"], git = "https://github.com/moonframehq/moonframe", optional = true, package = "moonframe" }
# The same app drawn by Rune instead of GPUI (the `rune` feature):
# Moonframe's experimental renderer, with the same builder, links no GPUI.
moonframe-rune = { branch = "main", git = "https://github.com/moonframehq/moonframe", optional = true }
serde_json     = "1"
tracing        = "0.1"

[features]
default = ["gpui", "herdr-core", "tmux"]
# What draws the window, from the same Luau: GPUI, the whole app, or Rune,
# Moonframe's experimental renderer, which has no windows of their own
# (Settings, Make it yours) or named themes yet. `rune` wins if both are on.
gpui = ["dep:moonframe-gpui"]
rune = ["dep:moonframe-rune"]
# Terminals kept by herdr-core (`hc`), and its machines. Rune always has
# herdr-core's terminals.
herdr-core = ["moonframe-gpui?/herdr-core"]
# Terminals kept by tmux, on the app's own server, and the agents in the
# user's other tmux servers. Moonframe's tmux backend needs no feature.
tmux = []

[profile.dev.package."*"]
# GPUI and Luau are unusably slow unoptimised; keep our own crate
# debuggable.
opt-level = 2

[profile.release]
codegen-units = 16
lto           = "thin"

# A crate of its own, even inside another's folder.
[workspace]
